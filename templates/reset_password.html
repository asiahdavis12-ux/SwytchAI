<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[PASSWORD] — Set New Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #0a1929 0%, #0d2137 50%, #0a1929 100%);">
    <div style="width: 100%; max-width: 420px; padding: 2rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <span style="font-size: 3rem;">🔐</span>
            <h1 style="color: #00e5ff; margin: 0.5rem 0 0.25rem; font-size: 2rem; letter-spacing: 2px;">[PASSWORD]</h1>
            <p style="color: #78909c; margin: 0; font-size: 0.9rem;">Create your new password</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash-{{ category }}" style="margin-bottom: 1rem;">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <div class="card">
            <div class="card-header">
                <h2>Set New Password</h2>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('reset_password', token=token) }}">
                    <div style="margin-bottom: 1.25rem;">
                        <label style="color: #b0bec5; font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 0.4rem;">New Password</label>
                        <input type="password" name="password" placeholder="Min 8 characters" required autofocus>
                    </div>
                    <div style="margin-bottom: 1.5rem;">
                        <label style="color: #b0bec5; font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 0.4rem;">Confirm New Password</label>
                        <input type="password" name="confirm_password" placeholder="Re-enter new password" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem; font-size: 1rem;">Reset Password</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
