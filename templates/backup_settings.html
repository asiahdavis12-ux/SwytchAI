{% extends "base.html" %}
{% block title %}Backup Settings{% endblock %}

{% block content %}
<div style="max-width: 700px; margin: 0 auto;">
    <div class="page-header">
        <h2>⚙️ Backup Settings</h2>
        <a href="{{ url_for('backups_page') }}" class="btn" style="background: rgba(255,255,255,0.06); color: #78909c;">← Back to Backups</a>
    </div>

    <form method="POST" action="{{ url_for('backup_settings') }}">
        <!-- Enable/Disable -->
        <div class="card" style="margin-bottom: 1.5rem; padding: 1.5rem;">
            <h3 style="margin-bottom: 1rem;">🔄 Automatic Backups</h3>
            <label style="display: flex; align-items: center; gap: 0.75rem; cursor: pointer;">
                <input type="checkbox" name="enabled" value="1" {% if settings.enabled %}checked{% endif %} style="width: 20px; height: 20px;">
                <span>Enable scheduled backups</span>
            </label>
        </div>

        <!-- Frequency -->
        <div class="card" style="margin-bottom: 1.5rem; padding: 1.5rem;">
            <h3 style="margin-bottom: 1rem;">📅 Frequency</h3>
            <select name="frequency" class="form-control" style="padding: 0.6rem; border-radius: 8px; width: 100%;">
                <option value="hourly" {% if settings.frequency == 'hourly' %}selected{% endif %}>Every Hour</option>
                <option value="every_6_hours" {% if settings.frequency == 'every_6_hours' %}selected{% endif %}>Every 6 Hours</option>
                <option value="every_12_hours" {% if settings.frequency == 'every_12_hours' %}selected{% endif %}>Every 12 Hours</option>
                <option value="daily" {% if settings.frequency == 'daily' %}selected{% endif %}>Daily</option>
                <option value="weekly" {% if settings.frequency == 'weekly' %}selected{% endif %}>Weekly (Sunday)</option>
            </select>
        </div>

        <!-- Time -->
        <div class="card" style="margin-bottom: 1.5rem; padding: 1.5rem;">
            <h3 style="margin-bottom: 1rem;">🕐 Backup Time (UTC)</h3>
            <div style="display: flex; gap: 1rem;">
                <div style="flex: 1;">
                    <label style="color: #78909c; font-size: 0.85rem;">Hour (0-23)</label>
                    <input type="number" name="backup_hour" value="{{ settings.backup_hour }}" min="0" max="23" class="form-control" style="padding: 0.6rem; border-radius: 8px; width: 100%;">
                </div>
                <div style="flex: 1;">
                    <label style="color: #78909c; font-size: 0.85rem;">Minute (0-59)</label>
                    <input type="number" name="backup_minute" value="{{ settings.backup_minute }}" min="0" max="59" class="form-control" style="padding: 0.6rem; border-radius: 8px; width: 100%;">
                </div>
            </div>
        </div>

        <!-- Retention -->
        <div class="card" style="margin-bottom: 1.5rem; padding: 1.5rem;">
            <h3 style="margin-bottom: 1rem;">🗑️ Retention Period</h3>
            <select name="retention_days" class="form-control" style="padding: 0.6rem; border-radius: 8px; width: 100%;">
                <option value="7" {% if settings.retention_days == 7 %}selected{% endif %}>7 days</option>
                <option value="14" {% if settings.retention_days == 14 %}selected{% endif %}>14 days</option>
                <option value="30" {% if settings.retention_days == 30 %}selected{% endif %}>30 days</option>
                <option value="60" {% if settings.retention_days == 60 %}selected{% endif %}>60 days</option>
                <option value="90" {% if settings.retention_days == 90 %}selected{% endif %}>90 days</option>
                <option value="180" {% if settings.retention_days == 180 %}selected{% endif %}>180 days</option>
                <option value="365" {% if settings.retention_days == 365 %}selected{% endif %}>1 year</option>
            </select>
            <p style="color: #78909c; font-size: 0.8rem; margin-top: 0.5rem;">Backups older than this will be automatically deleted.</p>
        </div>

        <!-- Notifications -->
        <div class="card" style="margin-bottom: 1.5rem; padding: 1.5rem;">
            <h3 style="margin-bottom: 1rem;">🔔 Notifications</h3>
            <label style="display: flex; align-items: center; gap: 0.75rem; cursor: pointer; margin-bottom: 0.75rem;">
                <input type="checkbox" name="notify_on_success" value="1" {% if settings.notify_on_success %}checked{% endif %} style="width: 18px; height: 18px;">
                <span>Notify on successful backup</span>
            </label>
            <label style="display: flex; align-items: center; gap: 0.75rem; cursor: pointer;">
                <input type="checkbox" name="notify_on_failure" value="1" {% if settings.notify_on_failure %}checked{% endif %} style="width: 18px; height: 18px;">
                <span>Notify on failed backup</span>
            </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem;">💾 Save Settings</button>
    </form>
</div>
{% endblock %}
