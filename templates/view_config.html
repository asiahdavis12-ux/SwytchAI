
{% extends "base.html" %}
{% block title %}Config v{{ version }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>📄 Config v{{ version }}</h1>
    <p>{{ host }}</p>
</div>

<div class="card">
    <div class="card-body">
        <pre class="config-view">{{ config_text }}</pre>
    </div>
</div>

<a href="{{ url_for('configs') }}" class="btn">← Back to Configs</a>
{% endblock %}
